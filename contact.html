    <main id="main-content">
        <section class="interior-hero section-shell" aria-labelledby="contact-title">
            <p class="eyebrow"><span class="status-dot" aria-hidden="true"></span> XMU MAKER <span class="eyebrow-divider" aria-hidden="true">/</span> CONTACT</p>
            <h1 id="contact-title">联系我们<span class="heading-dot" aria-hidden="true">.</span></h1>
        </section>
        <div class="interior-main section-shell">
            <div class="contact-grid">
                <section class="contact-card" aria-labelledby="president-label">
                    <div class="contact-card-heading">
                        <span class="contact-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></svg>
                        </span>
                        <span class="contact-index" aria-hidden="true">01 / QQ</span>
                    </div>
                    <h2 id="president-label">社长联系方式(QQ)</h2>
                    <div class="contact-number-row">
                        <p class="contact-number" id="president-qq">2461854243</p>
                        <button class="copy-button" type="button" data-copy-target="president-qq" data-copy-label="QQ 号码" aria-label="复制社长 QQ 号码" hidden>
                            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></svg>
                            复制
                        </button>
                    </div>
                    <p class="copy-status" role="status" aria-live="polite" aria-atomic="true"></p>
                </section>
                <section class="contact-card" aria-labelledby="group-label">
                    <div class="contact-card-heading">
                        <span class="contact-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2 21v-2a7 7 0 0 1 14 0v2M16 4.7a3.5 3.5 0 0 1 0 6.6M22 21v-2a7 7 0 0 0-4-6.3"/></svg>
                        </span>
                        <span class="contact-index" aria-hidden="true">02 / QQ</span>
                    </div>
                    <h2 id="group-label">纳新QQ群——群号</h2>
                    <div class="contact-number-row">
                        <p class="contact-number" id="recruitment-qq">754781386</p>
                        <button class="copy-button" type="button" data-copy-target="recruitment-qq" data-copy-label="群号" aria-label="复制纳新 QQ 群号" hidden>
                            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></svg>
                            复制
                        </button>
                    </div>
                    <p class="copy-status" role="status" aria-live="polite" aria-atomic="true"></p>
                </section>
                <section class="contact-address" aria-labelledby="address-label">
                    <div class="address-copy">
                        <h2 id="address-label"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 11-8 11S4 16 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg>地址</h2>
                        <address><span class="address-room">M03</span><span class="address-building">新工科大楼</span><span class="address-campus">厦门大学翔安校区</span></address>
                    </div>
                    <div class="address-art" aria-hidden="true">
                        <div class="address-art-grid"></div>
                        <svg viewBox="0 0 320 240" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round">
                            <path class="building-outline" d="m80 76 98-38 78 35v122l-98 30-78-40V76Z"/>
                            <path d="m80 76 78 35 98-38M158 111v114M178 38v55"/>
                            <path d="m99 109 39 17v19l-39-17v-19Zm0 42 39 17v19l-39-17v-19ZM178 124l56-18v20l-56 18v-20Zm0 40 56-18v20l-56 18v-20Z"/>
                            <path class="building-ground" d="m32 188 108 53 148-47M52 60l126-49 108 49M178 11v-9" stroke-dasharray="4 7"/>
                            <circle cx="256" cy="73" r="5" fill="currentColor" stroke="none"/>
                        </svg>
                    </div>
                </section>
            </div>
        </div>
